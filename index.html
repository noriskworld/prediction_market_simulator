  <!-- MODULE 1 & 2: DECOUPLED PURE PRICING ENGINE -->
  <!-- ========================================== -->
  <script>
    /**
     * PredictionEngine - Stateless Headless Pricing and Risk Engine.
     * Contains pure mathematical models for trades, fees, arbitrage, and expected value.
     */
    const PredictionEngine = {
      /**
       * Ingest platform parameters and outputs precise transaction fee deductions.
       * 
       * Kalshi:
       * - Taker: 0.07 * Q * P * (1-P)
       * - Maker: 0.0175 * Q * P * (1-P)
       * 
       * Polymarket:
       * - Crypto Taker: 0.05 * Q * P * (1-P)
       * - Sports Taker: 0.03 * Q * P * (1-P)
       * - Maker / Others: 0.00
       */
      calculateFee(platform, orderType, category, quantity, price) {
        const Q = Number(quantity);
        const P = Number(price);
        
        if (isNaN(Q) || isNaN(P) || Q <= 0 || P <= 0 || P >= 1) {
          return 0;
        }

        const variance = P * (1.0 - P);

        if (platform === 'Kalshi') {
          if (orderType === 'Maker') {
            return 0.0175 * Q * variance;
          } else {
            return 0.07 * Q * variance;
          }
        } else if (platform === 'Polymarket') {
          if (orderType === 'Taker') {
            if (category === 'Crypto') {
              return 0.05 * Q * variance;
            } else if (category === 'Sports') {
              return 0.03 * Q * variance;
            }
          }
        }
        return 0; // Default zero fees
      },

      /**
       * Portfolio Matrix Generator:
       * Calculates total cost basis, fees, payoffs, net profit/loss, and ROI
       * under both YES and NO terminal outcomes for an array of holdings.
       * 
       * API Blueprint: evaluateTradeArray(portfolio: Position[], platform: string): ValidationMatrix
       */
      evaluateTradeArray(portfolio, platform) {
        let totalCostBasis = 0;
        let totalFees = 0;
        let payoutIfYes = 0;
        let payoutIfNo = 0;

        const positions = portfolio.map(pos => {
          const q = Number(pos.quantity) || 0;
          const p = Number(pos.price) || 0;
          const plat = pos.platform || platform;
          
          const fee = this.calculateFee(plat, pos.orderType, pos.category, q, p);
          const cost = q * p;
          
          totalCostBasis += cost;
          totalFees += fee;

          const payoffYes = pos.outcome === 'YES' ? q * 1.0 : 0.0;
          const payoffNo = pos.outcome === 'NO' ? q * 1.0 : 0.0;

          payoutIfYes += payoffYes;
          payoutIfNo += payoffNo;

          return {
            ...pos,
            cost,
            fee,
            totalCost: cost + fee,
            payoffYes,
            payoffNo,
            netPnLYes: payoffYes - (cost + fee),
            netPnLNo: payoffNo - (cost + fee)
          };
        });

        const totalCapitalDeployed = totalCostBasis + totalFees;
        const netPnLYes = payoutIfYes - totalCapitalDeployed;
        const netPnLNo = payoutIfNo - totalCapitalDeployed;
        
        const roiYes = totalCapitalDeployed > 0 ? (netPnLYes / totalCapitalDeployed) * 100 : 0;
        const roiNo = totalCapitalDeployed > 0 ? (netPnLNo / totalCapitalDeployed) * 100 : 0;
        
        // Maximum drawdown is the worst-case loss scenario (out of YES/NO outcomes)
        const maxDrawdownAmount = totalCapitalDeployed - Math.min(payoutIfYes, payoutIfNo);

        return {
          totalCostBasis,
          totalFees,
          totalCapitalDeployed,
          payoutYes: payoutIfYes,
          payoutNo: payoutIfNo,
          netPnLYes,
          netPnLNo,
          roiYes,
          roiNo,
          maxDrawdownAmount,
          positions
        };
      },

      /**
       * Algorithmic Risk Evaluator:
       * Accepts true probability and validation matrix to calculate Net Expected Value.
       * 
       * API Blueprint: calculateEV(trueProbability: number, portfolioMatrix: ValidationMatrix): number
       */
      calculateEV(trueProbability, portfolioMatrix) {
        const probYes = Number(trueProbability);
        if (isNaN(probYes) || probYes < 0 || probYes > 1) return 0;
        const probNo = 1.0 - probYes;
        return (probYes * portfolioMatrix.netPnLYes) + (probNo * portfolioMatrix.netPnLNo);
      },

      /**
       * Arbitrage Detector:
       * Examines multi-platform YES/NO ask data to detect mispriced contracts
       * where total purchase cost (inclusive of routing fees) is < $1.00.
       */
      detectArbitrage(marketPrices) {
        const opportunities = [];
        
        for (let i = 0; i < marketPrices.length; i++) {
          for (let j = 0; j < marketPrices.length; j++) {
            const yesMarket = marketPrices[i];
            const noMarket = marketPrices[j];

            const yesPrice = Number(yesMarket.yesAsk);
            const noPrice = Number(noMarket.noAsk);

            if (isNaN(yesPrice) || isNaN(noPrice) || yesPrice <= 0 || noPrice <= 0 || yesPrice >= 1 || noPrice >= 1) {
              continue;
            }

            const yesFee = this.calculateFee(
              yesMarket.platform, 
              yesMarket.orderType || 'Taker', 
              yesMarket.category || 'Crypto', 
              1, 
              yesPrice
            );

            const noFee = this.calculateFee(
              noMarket.platform, 
              noMarket.orderType || 'Taker', 
              noMarket.category || 'Crypto', 
              1, 
              noPrice
            );

            const yesCost = yesPrice + yesFee;
            const noCost = noPrice + noFee;
            const totalCost = yesCost + noCost;

            if (totalCost < 1.00) {
              opportunities.push({
                yesPlatform: yesMarket.platform,
                yesOrderType: yesMarket.orderType || 'Taker',
                yesCategory: yesMarket.category || 'Crypto',
                yesPrice,
                yesFee,
                yesCost,
                noPlatform: noMarket.platform,
                noOrderType: noMarket.orderType || 'Taker',
                noCategory: noMarket.category || 'Crypto',
                noPrice,
                noFee,
                noCost,
                totalCost,
                netProfit: 1.00 - totalCost,
                roi: ((1.00 - totalCost) / totalCost) * 100
              });
            }
          }
        }
        return opportunities;
      }
    };

    // Export to window object for execution environment availability
    window.PredictionEngine = PredictionEngine;
  </script>

  <script type="text/babel">
    const { useState, useEffect, useRef } = React;

    // Direct SVGs for custom visual experience
    const Icons = {

      ),
      Trash: () => (

          <path strokeLinecap="round" strokeLinejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
        </svg>
      ),
      Terminal: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M8 9l3 3-3 3m5 0h3M5 20h14a2 2 0 002-2V6a2 2 0 00-2-2H5a2 2 0 00-2 2v12a2 2 0 002 2z" />
        </svg>
      ),
      Play: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z" />
          <path strokeLinecap="round" strokeLinejoin="round" d="M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      Pause: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M10 9v6m4-6v6m7-3a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      ),
      ShieldAlert: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-6 h-6 text-emerald-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
        </svg>
      ),
      Activity: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-5 h-5 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z" />
        </svg>
      ),
      Info: () => (
        <svg xmlns="http://www.w3.org/2000/svg" className="w-4 h-4 text-zinc-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" strokeWidth="2">
          <path strokeLinecap="round" strokeLinejoin="round" d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
        </svg>
      )
    };

    function App() {
      // --- State Hook Definitions ---
      const [portfolio, setPortfolio] = useState([
        { id: '1', platform: 'Polymarket', outcome: 'YES', price: 0.45, quantity: 1000, orderType: 'Taker', category: 'Crypto' },
        { id: '2', platform: 'Kalshi', outcome: 'NO', price: 0.52, quantity: 500, orderType: 'Taker', category: 'Other' },
        { id: '3', platform: 'Polymarket', outcome: 'YES', price: 0.40, quantity: 800, orderType: 'Maker', category: 'Sports' }
      ]);

      const [newTrade, setNewTrade] = useState({
        platform: 'Polymarket',
        outcome: 'YES',
        price: '0.50',
        quantity: '100',
        orderType: 'Taker',
        category: 'Crypto'
      });

      const [trueProbability, setTrueProbability] = useState(0.50); // Slider: 0 to 1

      // Arbitrage Detector Interactive State
      const [polyPrices, setPolyPrices] = useState({ yesAsk: '0.44', noAsk: '0.59', orderType: 'Taker', category: 'Crypto' });
      const [kalshiPrices, setKalshiPrices] = useState({ yesAsk: '0.42', noAsk: '0.55', orderType: 'Taker' });
      const [arbitrageResults, setArbitrageResults] = useState([]);

      // Algorithmic Log state
      const [logs, setLogs] = useState([
        { id: 1, type: 'INFO', time: new Date().toLocaleTimeString(), message: 'Pricing and Evaluation Engine initialized.' },
        { id: 2, type: 'INFO', time: new Date().toLocaleTimeString(), message: 'Listening to orderbook WebSocket channels...' }
      ]);
      const [isSimulating, setIsSimulating] = useState(true);
      const [simSpeed, setSimSpeed] = useState(4000); // ms

      const terminalEndRef = useRef(null);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // --- Math Evaluations ---
      const matrix = PredictionEngine.evaluateTradeArray(portfolio, 'Polymarket');
      const expectedValue = PredictionEngine.calculateEV(trueProbability, matrix);

      // --- Arbitrage Trigger ---
      useEffect(() => {
        const marketData = [
          { platform: 'Polymarket', yesAsk: polyPrices.yesAsk, noAsk: polyPrices.noAsk, orderType: polyPrices.orderType, category: polyPrices.category },
          { platform: 'Kalshi', yesAsk: kalshiPrices.yesAsk, noAsk: kalshiPrices.noAsk, orderType: kalshiPrices.orderType, category: 'Other' }
        ];
        const results = PredictionEngine.detectArbitrage(marketData);
        setArbitrageResults(results);
      }, [polyPrices, kalshiPrices]);

      // --- Auto-scroll Terminal Logs ---
      useEffect(() => {
        if (terminalEndRef.current) {
          terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });
        }
      }, [logs]);

      // --- Chart.js Hooks ---
      useEffect(() => {
        if (chartRef.current) {
          const ctx = chartRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: ['YES Expiration ($1.00)', 'NO Expiration ($1.00)'],
              datasets: [{
                label: 'Net PnL ($)',
                data: [matrix.netPnLYes, matrix.netPnLNo],
                backgroundColor: [
                  matrix.netPnLYes >= 0 ? 'rgba(16, 185, 129, 0.4)' : 'rgba(244, 63, 94, 0.4)',
                  matrix.netPnLNo >= 0 ? 'rgba(16, 185, 129, 0.4)' : 'rgba(244, 63, 94, 0.4)'
                ],
                borderColor: [
                  matrix.netPnLYes >= 0 ? '#10b981' : '#f43f5e',
                  matrix.netPnLNo >= 0 ? '#10b981' : '#f43f5e'
                ],
                borderWidth: 1.5,
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: 'rgba(63, 63, 70, 0.2)' },
                  ticks: { color: '#a1a1aa', font: { family: 'Inter' } }
                },
                x: {
                  grid: { display: false },
                  ticks: { color: '#a1a1aa', font: { family: 'Inter' } }
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#18181b',
                  borderColor: 'rgba(63, 63, 70, 0.6)',
                  borderWidth: 1,
                  bodyColor: '#f4f4f5',
                  titleColor: '#f4f4f5'
                }
              }
            }
          });
        }

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, []);

      // Update Chart on State Change
      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.data.datasets[0].data = [matrix.netPnLYes, matrix.netPnLNo];
          chartInstance.current.data.datasets[0].backgroundColor = [
            matrix.netPnLYes >= 0 ? 'rgba(16, 185, 129, 0.4)' : 'rgba(244, 63, 94, 0.4)',
            matrix.netPnLNo >= 0 ? 'rgba(16, 185, 129, 0.4)' : 'rgba(244, 63, 94, 0.4)'
          ];
          chartInstance.current.data.datasets[0].borderColor = [
            matrix.netPnLYes >= 0 ? '#10b981' : '#f43f5e',
            matrix.netPnLNo >= 0 ? '#10b981' : '#f43f5e'
          ];
          chartInstance.current.update();
        }
      }, [matrix.netPnLYes, matrix.netPnLNo]);

      // --- WebSocket / Algorithmic Feed Simulation ---
      useEffect(() => {
        if (!isSimulating) return;

        const interval = setInterval(() => {
          const logTypes = ['FEED', 'MODEL', 'ENGINE', 'ARBITRAGE'];
          const randomType = logTypes[Math.floor(Math.random() * logTypes.length)];
          const time = new Date().toLocaleTimeString();
          let message = '';

          switch (randomType) {
            case 'FEED': {
              const platforms = ['Polymarket', 'Kalshi'];
              const plat = platforms[Math.floor(Math.random() * platforms.length)];
              const side = Math.random() > 0.5 ? 'YES' : 'NO';
              const delta = (Math.random() * 0.04 - 0.02);
              
              if (plat === 'Polymarket') {
                const currentYes = parseFloat(polyPrices.yesAsk);
                const nextYes = Math.max(0.05, Math.min(0.95, currentYes + delta)).toFixed(2);
                setPolyPrices(prev => ({ ...prev, yesAsk: nextYes }));
                message = `Polymarket ${side} ask updated to $${nextYes} (Crypto).`;
              } else {
                const currentNo = parseFloat(kalshiPrices.noAsk);
                const nextNo = Math.max(0.05, Math.min(0.95, currentNo + delta)).toFixed(2);
                setKalshiPrices(prev => ({ ...prev, noAsk: nextNo }));
                message = `Kalshi ${side} ask updated to $${nextNo} (Taker).`;
              }
              break;
            }
            case 'MODEL': {
              const deltaProb = (Math.random() * 0.08 - 0.04);
              const nextProb = Math.max(0.01, Math.min(0.99, trueProbability + deltaProb));
              setTrueProbability(parseFloat(nextProb.toFixed(3)));
              message = `Machine Learning Model update: True probability adjusted to ${(nextProb * 100).toFixed(1)}%.`;
              break;
            }
            case 'ENGINE': {
              message = `Recalculating expected value vectors. EV is currently ${expectedValue >= 0 ? '+' : ''}$${expectedValue.toFixed(2)}.`;
              break;
            }
            case 'ARBITRAGE': {
              const testData = [
                { platform: 'Polymarket', yesAsk: polyPrices.yesAsk, noAsk: polyPrices.noAsk, orderType: polyPrices.orderType, category: polyPrices.category },
                { platform: 'Kalshi', yesAsk: kalshiPrices.yesAsk, noAsk: kalshiPrices.noAsk, orderType: kalshiPrices.orderType, category: 'Other' }
              ];
              const arbs = PredictionEngine.detectArbitrage(testData);
              if (arbs.length > 0) {
                const path = arbs[0];
                message = `🔥 ARBITRAGE SIGNAL: Buy YES on ${path.yesPlatform} ($${path.yesPrice}) + NO on ${path.noPlatform} ($${path.noPrice}). Combined: $${path.totalCost.toFixed(4)}. Net: +$${path.netProfit.toFixed(4)}/contract!`;
              } else {
                message = `Scanning markets... Combined cross-platform prices optimal. No mispricing found.`;
              }
              break;
            }
            default:
              message = 'System status nominal.';
          }

          setLogs(prev => [...prev.slice(-49), { id: Date.now(), type: randomType, time, message }]);
        }, simSpeed);

        return () => clearInterval(interval);
      }, [isSimulating, polyPrices, kalshiPrices, trueProbability, expectedValue, simSpeed]);

      // --- UI Actions ---
      const handleAddTrade = (e) => {
        e.preventDefault();
        const price = parseFloat(newTrade.price);
        const qty = parseInt(newTrade.quantity);

        if (isNaN(price) || price <= 0 || price >= 1) {
          alert('Price must be between 0.01 and 0.99');
          return;
        }
        if (isNaN(qty) || qty <= 0) {
          alert('Quantity must be greater than 0');
          return;
        }

        const added = {
          id: Date.now().toString(),
          platform: newTrade.platform,
          outcome: newTrade.outcome,
          price,
          quantity: qty,
          orderType: newTrade.orderType,
          category: newTrade.platform === 'Polymarket' ? newTrade.category : 'Other'
        };

        setPortfolio(prev => [...prev, added]);
        
        // Add to log
        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'ENGINE',
          time: new Date().toLocaleTimeString(),
          message: `Added portfolio trade: Buy ${qty} ${newTrade.outcome} at $${price} on ${newTrade.platform}.`
        }]);
      };

      const handleRemoveTrade = (id) => {
        setPortfolio(prev => prev.filter(item => item.id !== id));
        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'ENGINE',
          time: new Date().toLocaleTimeString(),
          message: `Removed trade ID: ${id} from active risk matrix.`
        }]);
      };

      const loadMockPortfolio = (scenario) => {
        if (scenario === 'bull') {
          setPortfolio([

                    let typeColor = 'text-zinc-500';
                    if (log.type === 'MODEL') typeColor = 'text-indigo-400';
                    if (log.type === 'FEED') typeColor = 'text-sky-400';
                    if (log.type === 'ARBITRAGE') typeColor = 'text-emerald-400 font-bold';
                    if (log.type === 'ENGINE') typeColor = 'text-yellow-400';

                    return (
                      <div key={log.id} className="mb-1.5 leading-relaxed break-words border-b border-zinc-950/20 pb-0.5">
                        <span className="text-zinc-600">[{log.time}]</span>{' '}
                        <span className={typeColor}>[{log.type}]</span>{' '}
                        <span className="text-zinc-300">{log.message}</span>
                      </div>
                    );
                  })}
                  <div ref={terminalEndRef}></div>
                </div>
              </section>

            </div>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
