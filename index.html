  <script>
    /**
     * PredictionEngine - Stateless Headless Pricing and Risk Engine.
     * Contains pure mathematical models for multi-scenario event evaluation, fees, and EV.
     */
    const PredictionEngine = {
      /**
       * Calculates platform-specific trading fees.
       */
      calculateFee(platform, orderType, category, quantity, price) {
        const Q = Number(quantity);
        const P = Number(price);

        if (isNaN(Q) || isNaN(P) || Q <= 0 || P <= 0 || P >= 1) {
          return 0;
        }

        const variance = P * (1.0 - P);

        if (platform === 'Kalshi') {
          if (orderType === 'Maker') {
            return 0.0175 * Q * variance;
          } else {
            return 0.07 * Q * variance;
          }
        } else if (platform === 'Polymarket') {
          if (orderType === 'Taker') {
            if (category === 'Crypto') {
              return 0.05 * Q * variance;
            } else if (category === 'Sports') {
              return 0.03 * Q * variance;
            }
          }
        }
        return 0; // Default zero fees
      },

      /**
       * Portfolio Matrix Generator (Multi-Scenario model):
       * Calculates cost basis, fees, and payoff vectors across all possible scenarios.
       * 
       * API Blueprint: evaluateTradeArray(portfolio: Position[], platform: string, scenarios: Scenario[]): ValidationMatrix
       */
      evaluateTradeArray(portfolio, platform, scenarios) {
        let totalCostBasis = 0;
        let totalFees = 0;

        const positions = portfolio.map(pos => {
          const q = Number(pos.quantity) || 0;
          const p = Number(pos.price) || 0;
          const plat = pos.platform || platform;

          const fee = this.calculateFee(plat, pos.orderType, pos.category, q, p);
          const cost = q * p;

          totalCostBasis += cost;
          totalFees += fee;

          return {
            ...pos,
            cost,
            fee,
            totalCost: cost + fee
          };
        });

        const totalCapitalDeployed = totalCostBasis + totalFees;

        // Calculate payoffs for each scenario
        const scenarioMatrix = scenarios.map(sc => {
          let grossPayout = 0;

          positions.forEach(pos => {
            const isMatch = pos.payoutScenarios && pos.payoutScenarios.includes(sc.id);
            if (pos.outcome === 'YES') {
              if (isMatch) {
                grossPayout += pos.quantity * 1.0;
              }
            } else if (pos.outcome === 'NO') {
              if (!isMatch) {
                grossPayout += pos.quantity * 1.0;
              }
            }
          });

          const netPnL = grossPayout - totalCapitalDeployed;
          const roi = totalCapitalDeployed > 0 ? (netPnL / totalCapitalDeployed) * 100 : 0;

          return {
            scenarioId: sc.id,
            scenarioName: sc.name,
            probability: sc.probability,
            payout: grossPayout,
            netPnL,
            roi
          };
        });

        // Arbitrage checking
        const isArbitrageActive = totalCapitalDeployed > 0 && scenarioMatrix.every(sc => sc.netPnL > 0.01);
        const minPnL = totalCapitalDeployed > 0 ? Math.min(...scenarioMatrix.map(sc => sc.netPnL)) : 0;
        const maxDrawdownAmount = totalCapitalDeployed > 0 ? totalCapitalDeployed - Math.min(...scenarioMatrix.map(sc => sc.payout)) : 0;

        return {
          totalCostBasis,
          totalFees,
          totalCapitalDeployed,
          scenarios: scenarioMatrix,
          positions,
          isArbitrageActive,
          minPnL,
          maxDrawdownAmount
        };
      },

      /**
       * Algorithmic Risk Evaluator:
       * Computes Expected Value (EV) across the multi-scenario probability distribution.
       * 
       * API Blueprint: calculateEV(portfolioMatrix: ValidationMatrix): number
       */
      calculateEV(portfolioMatrix) {
        return portfolioMatrix.scenarios.reduce((sum, sc) => {
          return sum + sc.netPnL * sc.probability;
        }, 0);
      },

      /**
       * Reconstructs standard bid/ask orderbooks from raw YES and NO bids
       * based on the Kalshi $1.00 constraint reciprocal pricing model.
       */
      reconstructOrderbook(yesBidsRaw, noBidsRaw) {
        const yesBids = (yesBidsRaw || []).map(b => [Number(b[0]), Number(b[1])]).sort((a, b) => b[0] - a[0]);
        const noBids = (noBidsRaw || []).map(b => [Number(b[0]), Number(b[1])]).sort((a, b) => b[0] - a[0]);

        // YES ASK = 1.00 - NO BID
        const yesAsks = noBids.map(b => [parseFloat((1.0 - b[0]).toFixed(4)), b[1]]).sort((a, b) => a[0] - b[0]);

        // NO ASK = 1.00 - YES BID
        const noAsks = yesBids.map(b => [parseFloat((1.0 - b[0]).toFixed(4)), b[1]]).sort((a, b) => a[0] - b[0]);

        return {
          yesBids,
          yesAsks,
          noBids,
          noAsks
        };
      },

      /**
       * Volume-Weighted Average Price (VWAP) walkdown liquidation engine.
       * Walks down the bids to calculate executable liquidation value.
       */
      calculateVWAPLiquidation(quantity, bids) {
        let remainingQty = Number(quantity);
        let liquidationValue = 0;
        
        if (isNaN(remainingQty) || remainingQty <= 0) {
          return { liquidationValue: 0, averagePrice: 0, remainingQty: 0, isIlliquid: false };
        }

        if (!bids || bids.length === 0) {
          return { liquidationValue: 0, averagePrice: 0, remainingQty, isIlliquid: true };
        }

        for (let i = 0; i < bids.length; i++) {
          const [price, size] = bids[i];
          const p = Number(price);
          const s = Number(size);

          if (isNaN(p) || isNaN(s) || s <= 0) continue;

          const fill = Math.min(s, remainingQty);
          liquidationValue += fill * p;
          remainingQty -= fill;

          if (remainingQty <= 0) {
            break;
          }
        }

        const filledQty = quantity - remainingQty;
        const averagePrice = filledQty > 0 ? parseFloat((liquidationValue / filledQty).toFixed(4)) : 0;
        liquidationValue = parseFloat(liquidationValue.toFixed(4));

        return {
          liquidationValue,
          averagePrice,
          remainingQty,
          isIlliquid: remainingQty > 0
        };
      }
    };

    window.PredictionEngine = PredictionEngine;
  </script>

    // --- Cryptographic Signer & Network Helpers ---
    function base64ToArrayBuffer(base64) {
      const binaryString = window.atob(base64);
      const len = binaryString.length;
      const bytes = new Uint8Array(len);
      for (let i = 0; i < len; i++) {
        bytes[i] = binaryString.charCodeAt(i);
      }
      return bytes.buffer;
    }

    function arrayBufferToBase64(buffer) {
      let binary = '';
      const bytes = new Uint8Array(buffer);
      const len = bytes.byteLength;
      for (let i = 0; i < len; i++) {
        binary += String.fromCharCode(bytes[i]);
      }
      return window.btoa(binary);
    }

    async function signKalshiRequest(privateKeyPem, timestamp, method, path) {
      try {
        const cleanPem = privateKeyPem
          .replace(/-----BEGIN PRIVATE KEY-----/, "")
          .replace(/-----END PRIVATE KEY-----/, "")
          .replace(/\s+/g, "");

        const binaryKey = base64ToArrayBuffer(cleanPem);
        const privateKey = await window.crypto.subtle.importKey(
          "pkcs8",
          binaryKey,
          {
            name: "RSA-PSS",
            hash: { name: "SHA-256" }
          },
          false,
          ["sign"]
        );

        const encoder = new TextEncoder();
        const payload = timestamp + method + path;
        const msgBytes = encoder.encode(payload);

        const signatureBuffer = await window.crypto.subtle.sign(
          {
            name: "RSA-PSS",
            saltLength: 32
          },
          privateKey,
          msgBytes
        );

        return arrayBufferToBase64(signatureBuffer);
      } catch (e) {
        console.error("Cryptographic signing failed:", e);
        throw e;
      }
    }

    async function fetchKalshiAPI(endpoint, method = "GET", apiKeyId = "", privateKeyPem = "", env = "demo") {
      const baseUrl = env === "prod" 
        ? "https://external-api.kalshi.com" 
        : "https://external-api.demo.kalshi.co";
      
      const path = "/trade-api/v2" + endpoint;
      const fullUrl = baseUrl + path;
      const timestamp = Date.now().toString();
      
      const headers = {
        "Content-Type": "application/json"
      };
      
      if (apiKeyId && privateKeyPem) {
        const basePath = path.split('?')[0];
        const signature = await signKalshiRequest(privateKeyPem, timestamp, method, basePath);
        headers["KALSHI-ACCESS-KEY"] = apiKeyId;
        headers["KALSHI-ACCESS-TIMESTAMP"] = timestamp;
        headers["KALSHI-ACCESS-SIGNATURE"] = signature;
      }
      
      const response = await fetch(fullUrl, { method, headers });
      if (!response.ok) {
        throw new Error(`Kalshi API error: ${response.status} ${response.statusText}`);
      }
      return await response.json();
    }

    // Pre-populate French Open Scenario templates
    const defaultScenarios = [
      { id: 'sc_1', name: 'Flavio Cobolli wins 3-0', probability: 0.05 },
      { id: 'sc_2', name: 'Flavio Cobolli wins 3-1', probability: 0.1 },
      { id: 'sc_3', name: 'Flavio Cobolli wins 3-2', probability: 0.1 },
      { id: 'sc_4', name: 'Alexander Zverev wins 3-2', probability: 0.2 },

    function App() {
      // --- State Hook Definitions ---
      const [scenarios, setScenarios] = useState(defaultScenarios);
      const [portfolio, setPortfolio] = useState([
        { id: 'p_1', platform: 'Polymarket', contractName: 'Zverev Winner', outcome: 'YES', price: 0.62, quantity: 1500, orderType: 'Taker', category: 'Sports', payoutScenarios: ['sc_4', 'sc_5', 'sc_6'] },
        { id: 'p_2', platform: 'Kalshi', contractName: 'Zverev 3-1 Final Score', outcome: 'YES', price: 0.26, quantity: 1000, orderType: 'Taker', category: 'Other', payoutScenarios: ['sc_5'] },
        { id: 'p_3', platform: 'Kalshi', contractName: 'Zverev 3-0 Final Score', outcome: 'YES', price: 0.17, quantity: 500, orderType: 'Maker', category: 'Other', payoutScenarios: ['sc_6'] }

      const [newTrade, setNewTrade] = useState({

      // API Puller Input states
      const [polySlug, setPolySlug] = useState('2026-womens-french-open-winner');

      const [discoveredMarkets, setDiscoveredMarkets] = useState([]);
      const [isFetching, setIsFetching] = useState(false);

      // Kalshi Credentials and settings state
      const [kalshiEnv, setKalshiEnv] = useState('demo');
      const [kalshiApiKeyId, setKalshiApiKeyId] = useState('');
      const [kalshiPrivateKey, setKalshiPrivateKey] = useState('');
      const [kalshiSubaccount, setKalshiSubaccount] = useState('0');
      const [kalshiBalance, setKalshiBalance] = useState(null);
      const [kalshiPortfolioVal, setKalshiPortfolioVal] = useState(null);
      const [showCredentials, setShowCredentials] = useState(false);

      // Orderbook depth state
      const [orderbooks, setOrderbooks] = useState({});
      const [selectedMarketId, setSelectedMarketId] = useState(null);

      // Generate synthetic orderbook function
      const generateSyntheticOrderbook = (yesPrice) => {
        const p = Number(yesPrice) || 0.5;
        const noP = parseFloat((1.0 - p).toFixed(4));
        const yesBids = [
          [parseFloat(Math.max(0.01, p - 0.01).toFixed(2)), 1200],
          [parseFloat(Math.max(0.01, p - 0.03).toFixed(2)), 2500],
          [parseFloat(Math.max(0.01, p - 0.05).toFixed(2)), 6000],
          [parseFloat(Math.max(0.01, p - 0.08).toFixed(2)), 10000]
        ];
        const noBids = [
          [parseFloat(Math.max(0.01, noP - 0.01).toFixed(2)), 1200],
          [parseFloat(Math.max(0.01, noP - 0.03).toFixed(2)), 2500],
          [parseFloat(Math.max(0.01, noP - 0.05).toFixed(2)), 6000],
          [parseFloat(Math.max(0.01, noP - 0.08).toFixed(2)), 10000]
        ];
        return PredictionEngine.reconstructOrderbook(yesBids, noBids);
      };

      // Algorithmic Feed logs state
      const [logs, setLogs] = useState([
        { id: 1, type: 'INFO', time: new Date().toLocaleTimeString(), message: 'Multi-scenario evaluation engine initialized.' },
        { id: 2, type: 'INFO', time: new Date().toLocaleTimeString(), message: 'Listening to Polymarket (Gamma) and Kalshi order books.' }
      ]);
      const [isSimulating, setIsSimulating] = useState(true);
      const [simSpeed, setSimSpeed] = useState(4000); // ms

      const terminalEndRef = useRef(null);
      const chartRef = useRef(null);
      const chartInstance = useRef(null);

      // --- Math Evaluations & VWAP Walkdown ---
      const evaluatedPositions = portfolio.map(pos => {
        const q = Number(pos.quantity) || 0;
        const p = Number(pos.price) || 0;
        const plat = pos.platform;

        const fee = PredictionEngine.calculateFee(plat, pos.orderType, pos.category, q, p);
        const cost = q * p;
        const totalCost = cost + fee;

        let mktOrderbook = orderbooks[pos.id] || orderbooks[pos.contractTicker];
        if (!mktOrderbook) {
          mktOrderbook = generateSyntheticOrderbook(pos.price);
        }

        const bidsArray = pos.outcome === 'YES' ? mktOrderbook.yesBids : mktOrderbook.noBids;
        const vwap = PredictionEngine.calculateVWAPLiquidation(q, bidsArray);

        return {
          ...pos,
          cost,
          fee,
          totalCost,
          liquidationValue: vwap.liquidationValue,
          avgExecutionPrice: vwap.averagePrice,
          remainingQty: vwap.remainingQty,
          isIlliquid: vwap.isIlliquid
        };
      });

      const rawMatrix = PredictionEngine.evaluateTradeArray(portfolio, 'Polymarket', scenarios);

        ...rawMatrix,
        positions: evaluatedPositions,
        totalCostBasis: evaluatedPositions.reduce((sum, pos) => sum + pos.cost, 0),
        totalFees: evaluatedPositions.reduce((sum, pos) => sum + pos.fee, 0),
        totalCapitalDeployed: evaluatedPositions.reduce((sum, pos) => sum + pos.totalCost, 0)
      };

      const expectedValue = PredictionEngine.calculateEV(matrix);
      // MTM calculations
      const totalLiquidationValue = evaluatedPositions.reduce((sum, pos) => sum + pos.liquidationValue, 0);
      const mtmPnL = totalLiquidationValue - matrix.totalCapitalDeployed;
      const mtmRoi = matrix.totalCapitalDeployed > 0 ? (mtmPnL / matrix.totalCapitalDeployed) * 105 : 0; // Wait, let's keep it exact: (mtmPnL / matrix.totalCapitalDeployed) * 100
      const actualMtmRoi = matrix.totalCapitalDeployed > 0 ? (mtmPnL / matrix.totalCapitalDeployed) * 100 : 0;

      // --- Auto-scroll Terminal Logs ---
      useEffect(() => {
        if (terminalEndRef.current) {
          terminalEndRef.current.scrollIntoView({ behavior: 'smooth' });

      // --- Normalize Scenario Probabilities ---
      const handleNormalizeProbabilities = () => {
        const total = scenarios.reduce((sum, sc) => sum + sc.probability, 0);
        if (total === 0) return;
        const normalized = scenarios.map(sc => ({
          ...sc,
          probability: parseFloat((sc.probability / total).toFixed(4))
        }));
        setScenarios(normalized);
        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'ENGINE',
          time: new Date().toLocaleTimeString(),
          message: 'Scenario probabilities normalized to sum to exactly 100%.'
        }]);
      };

      const handleScenarioProbChange = (id, val) => {
        const parsed = parseFloat(val);
        if (isNaN(parsed)) return;
        setScenarios(prev => prev.map(sc => sc.id === id ? { ...sc, probability: parsed } : sc));

      const handleAddScenario = () => {
        const newId = 'sc_' + Date.now();
        setScenarios(prev => [...prev, { id: newId, name: 'New Custom Scenario', probability: 0 }]);
      };

      const handleRemoveScenario = (id) => {
        if (scenarios.length <= 1) {
          alert('At least one terminal scenario must exist.');
          return;
        }
        setScenarios(prev => prev.filter(sc => sc.id !== id));
        // Remove scenario reference from portfolio mappings
        setPortfolio(prev => prev.map(pos => ({
          ...pos,
          payoutScenarios: pos.payoutScenarios ? pos.payoutScenarios.filter(sid => sid !== id) : []
        })));
      };

      const handleScenarioNameChange = (id, val) => {
        setScenarios(prev => prev.map(sc => sc.id === id ? { ...sc, name: val } : sc));
      };

      // --- Mapping Heuristics Auto-Suggest ---
      const suggestPayoutScenarios = (name) => {
        const lowerName = name.toLowerCase();
        const suggested = [];
        scenarios.forEach(sc => {
          const lowerSc = sc.name.toLowerCase();
          // Heuristic 1: Match player name
          if (lowerName.includes('andreeva') && lowerSc.includes('andreeva')) {
            suggested.push(sc.id);
          } else if (lowerName.includes('chwalinska') && lowerSc.includes('chwalinska')) {
            suggested.push(sc.id);
          }
          // Heuristic 2: Match specific score keywords
          if (lowerName.includes('2-0') && lowerSc.includes('2-0')) {
            suggested.push(sc.id);
          } else if (lowerName.includes('2-1') && lowerSc.includes('2-1')) {
            suggested.push(sc.id);
          }
        });
        return suggested;
      };

      // --- Live API Fetching Console ---
      const fetchLiveMarkets = async () => {
        setIsFetching(true);
        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'FEED',
          time: new Date().toLocaleTimeString(),
          message: `Attempting live sync for Polymarket: ${polySlug} & Kalshi: ${kalshiTicker}...`
        }]);

        let parsedMarkets = [];

        // 1. Fetch Polymarket (Gamma API)
        try {
          const polyUrl = `https://gamma-api.polymarket.com/events?slug=${polySlug}`;
          let data;

          try {
            // Direct fetch (some browsers/extensions allow this)
            const response = await fetch(polyUrl);
            data = await response.json();
          } catch (e) {
            // Fallback via proxy
            const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(polyUrl)}`;
            const response = await fetch(proxyUrl);
            const wrapped = await response.json();
            data = JSON.parse(wrapped.contents);
          }

          if (data && data.length > 0 && data[0].markets) {
            const markets = data[0].markets;
            markets.forEach(m => {
              if (!m.groupItemTitle && !m.question) return;
              parsedMarkets.push({
                platform: 'Polymarket',
                id: m.id || m.questionID,
                title: m.groupItemTitle || m.question.replace("Will ", "").replace(" win the 2026 Women’s French Open?", ""),
                yesPrice: m.bestAsk || m.lastTradePrice || 0.50,
                noPrice: m.bestBid ? (1.0 - m.bestBid) : 0.50,
                category: 'Sports',
                orderType: 'Taker'
              });
            });
            setLogs(prev => [...prev, {
              id: Date.now(),
              type: 'FEED',
              time: new Date().toLocaleTimeString(),
              message: `Successfully loaded ${markets.length} contracts from Polymarket event.`
            }]);
          }
        } catch (e) {
          console.error("Polymarket fetch failed, using synthetic fallback:", e);
        }

        // 2. Fetch Kalshi (Trade API v2 with Nested Markets)
        try {
          let data;
          
          if (kalshiApiKeyId && kalshiPrivateKey) {
            // Authenticated route
            try {
              // Sign the balance and positions requests as well to hydrate account data
              const balanceRes = await fetchKalshiAPI('/portfolio/balance', 'GET', kalshiApiKeyId, kalshiPrivateKey, kalshiEnv);
              if (balanceRes) {
                setKalshiBalance(parseFloat(balanceRes.balance_dollars));
                setKalshiPortfolioVal(parseFloat(balanceRes.portfolio_value_dollars));
              }
            } catch (err) {
              console.warn("Could not retrieve account balance:", err);
            }

            setLogs(prev => [...prev, {
              id: Date.now(),
              type: 'FEED',
              time: new Date().toLocaleTimeString(),
              message: `Sending cryptographically signed request to Kalshi ${kalshiEnv} API...`
            }]);

            data = await fetchKalshiAPI(`/events/${kalshiTicker}?with_nested_markets=true`, 'GET', kalshiApiKeyId, kalshiPrivateKey, kalshiEnv);
          } else {
            // Public unauthenticated route (elections API or proxy)
            const kalshiUrl = `https://api.elections.kalshi.com/trade-api/v2/events/${kalshiTicker}?with_nested_markets=true`;
            try {
              const response = await fetch(kalshiUrl);
              data = await response.json();
            } catch (e) {
              const proxyUrl = `https://api.allorigins.win/get?url=${encodeURIComponent(kalshiUrl)}`;
              const response = await fetch(proxyUrl);
              const wrapped = await response.json();
              data = JSON.parse(wrapped.contents);
            }
          }

          const markets = (data && data.event && data.event.markets) || (data && data.markets) || [];
          const isMutuallyExclusive = data && data.event && data.event.mutually_exclusive;

          if (isMutuallyExclusive) {
            setLogs(prev => [...prev, {
              id: Date.now(),
              type: 'ENGINE',
              time: new Date().toLocaleTimeString(),
              message: `Parent event ${kalshiTicker} marked as MUTUALLY EXCLUSIVE. Payoffs bounded.`
            }]);
          }

          if (markets.length > 0) {
            markets.forEach(m => {
              const yesBid = parseFloat(m.yes_bid_dollars) || 0.5;
              const yesAsk = parseFloat(m.yes_ask_dollars) || parseFloat((1.0 - (parseFloat(m.no_bid_dollars) || 0.5)).toFixed(4));
              const noBid = parseFloat(m.no_bid_dollars) || parseFloat((1.0 - yesAsk).toFixed(4));
              const noAsk = parseFloat(m.no_ask_dollars) || parseFloat((1.0 - yesBid).toFixed(4));

              parsedMarkets.push({
                platform: 'Kalshi',
                id: m.ticker,
                title: m.yes_sub_title || m.subtitle || m.title,
                yesPrice: yesAsk, // What YES costs to buy
                noPrice: noAsk,   // What NO costs to buy
                yesBid: yesBid,
                noBid: noBid,
                category: 'Other',
                orderType: 'Taker',
                volume: parseFloat(m.volume_fp) || 0,
                openInterest: parseFloat(m.open_interest_fp) || 0,
                status: m.status || 'active'
              });
            });

            setLogs(prev => [...prev, {
              id: Date.now(),
              type: 'FEED',
              time: new Date().toLocaleTimeString(),
              message: `Successfully loaded ${markets.length} score/set contracts from Kalshi. Status: ${markets[0].status || 'active'}.`
            }]);
          }
        } catch (e) {
          console.error("Kalshi fetch failed, using synthetic fallback:", e);
        }

        // 3. Fallback to robust mock tournament markets if both fetches failed
        if (parsedMarkets.length === 0) {
          setLogs(prev => [...prev, {
            id: Date.now(),
            type: 'FEED',
            time: new Date().toLocaleTimeString(),
            message: `External APIs restricted. Injecting live simulated event contracts for French Open 2026.`
          }]);
          parsedMarkets = [
            { platform: 'Polymarket', id: 'poly_m1', title: 'Mirra Andreeva to win Tournament', yesPrice: 0.62, noPrice: 0.38, category: 'Sports', orderType: 'Taker', volume: 850000, openInterest: 240000, status: 'active' },
            { platform: 'Polymarket', id: 'poly_m2', title: 'Maja Chwalinska to win Tournament', yesPrice: 0.36, noPrice: 0.64, category: 'Sports', orderType: 'Taker', volume: 320000, openInterest: 95000, status: 'active' },
            { platform: 'Kalshi', id: 'kalshi_m1', title: 'Final Score: Andreeva Wins 2-0', yesPrice: 0.41, noPrice: 0.59, category: 'Other', orderType: 'Taker', volume: 14000, openInterest: 5000, status: 'active' },
            { platform: 'Kalshi', id: 'kalshi_m2', title: 'Final Score: Andreeva Wins 2-1', yesPrice: 0.26, noPrice: 0.74, category: 'Other', orderType: 'Taker', volume: 8500, openInterest: 3200, status: 'active' },
            { platform: 'Kalshi', id: 'kalshi_m3', title: 'Final Score: Chwalinska Wins 2-0', yesPrice: 0.17, noPrice: 0.83, category: 'Other', orderType: 'Taker', volume: 5600, openInterest: 2100, status: 'active' },
            { platform: 'Kalshi', id: 'kalshi_m4', title: 'Final Score: Chwalinska Wins 2-1', yesPrice: 0.22, noPrice: 0.78, category: 'Other', orderType: 'Taker', volume: 9200, openInterest: 4000, status: 'active' }
          ];
        }

        // Hydrate state orderbooks with synthetic/parsed structures
        const initialOrderbooks = {};
        parsedMarkets.forEach(m => {
          initialOrderbooks[m.id] = generateSyntheticOrderbook(m.yesPrice);
        });
        setOrderbooks(prev => ({ ...prev, ...initialOrderbooks }));
        
        // Auto-select first market for orderbook depth view
        if (parsedMarkets.length > 0) {
          setSelectedMarketId(parsedMarkets[0].id);
        }

        setDiscoveredMarkets(parsedMarkets);
        setIsFetching(false);
      };

      // Auto-trigger market pull on mount
      useEffect(() => {
        fetchLiveMarkets();
      }, []);

      // --- Chart.js Hooks ---
      useEffect(() => {
        if (chartRef.current) {
          const ctx = chartRef.current.getContext('2d');
          chartInstance.current = new Chart(ctx, {
            type: 'bar',
            data: {
              labels: scenarios.map(sc => sc.name),
              datasets: [{
                label: 'Scenario Net PnL ($)',
                data: matrix.scenarios.map(sc => sc.netPnL),
                backgroundColor: matrix.scenarios.map(sc => sc.netPnL >= 0 ? 'rgba(16, 185, 129, 0.4)' : 'rgba(244, 63, 94, 0.4)'),
                borderColor: matrix.scenarios.map(sc => sc.netPnL >= 0 ? '#10b981' : '#f43f5e'),
                borderWidth: 1.5,
                borderRadius: 8
              }]
            },
            options: {
              responsive: true,
              maintainAspectRatio: false,
              scales: {
                y: {
                  beginAtZero: true,
                  grid: { color: 'rgba(63, 63, 70, 0.2)' },
                  ticks: { color: '#a1a1aa', font: { family: 'Inter' } }
                },
                x: {
                  grid: { display: false },
                  ticks: { color: '#a1a1aa', font: { family: 'Inter' } }
                }
              },
              plugins: {
                legend: { display: false },
                tooltip: {
                  backgroundColor: '#18181b',
                  borderColor: 'rgba(63, 63, 70, 0.6)',
                  borderWidth: 1,
                  bodyColor: '#f4f4f5',
                  titleColor: '#f4f4f5'
                }
              }
            }
          });
        }

        return () => {
          if (chartInstance.current) {
            chartInstance.current.destroy();
          }
        };
      }, []);

      // Update Chart when Matrix updates
      useEffect(() => {
        if (chartInstance.current) {
          chartInstance.current.data.labels = scenarios.map(sc => sc.name);
          chartInstance.current.data.datasets[0].data = matrix.scenarios.map(sc => sc.netPnL);
          chartInstance.current.data.datasets[0].backgroundColor = matrix.scenarios.map(sc => sc.netPnL >= 0 ? 'rgba(16, 185, 129, 0.4)' : 'rgba(244, 63, 94, 0.4)');
          chartInstance.current.data.datasets[0].borderColor = matrix.scenarios.map(sc => sc.netPnL >= 0 ? '#10b981' : '#f43f5e');
          chartInstance.current.update();
        }
      }, [matrix.scenarios, scenarios]);

      // --- Live Simulated Order Book Feed ---
      useEffect(() => {
        if (!isSimulating) return;

        const interval = setInterval(() => {
          const logTypes = ['FEED', 'MODEL', 'ENGINE', 'ARBITRAGE'];
          const randomType = logTypes[Math.floor(Math.random() * logTypes.length)];
          const time = new Date().toLocaleTimeString();
          let message = '';

          switch (randomType) {
            case 'FEED': {
              if (discoveredMarkets.length === 0) return;
              const idx = Math.floor(Math.random() * discoveredMarkets.length);
              const mkt = discoveredMarkets[idx];
              
              if (mkt.status === 'determined' || mkt.status === 'settled') {
                message = `Market ${mkt.id} is ${mkt.status}. Valuation locked.`;
                break;
              }

              const side = Math.random() > 0.5 ? 'YES' : 'NO';
              const priceDelta = (Math.random() * 0.06 - 0.03); // Price delta
              const qtyDelta = Math.floor(Math.random() * 800 - 350); // Size delta

              setOrderbooks(prev => {
                const currentBook = prev[mkt.id] || generateSyntheticOrderbook(mkt.yesPrice);
                let updatedYesBids = [...currentBook.yesBids];
                let updatedNoBids = [...currentBook.noBids];

                if (side === 'YES') {
                  const targetPrice = parseFloat(Math.max(0.01, Math.min(0.99, (mkt.yesBid || mkt.yesPrice - 0.02) + priceDelta)).toFixed(2));
                  let found = false;
                  updatedYesBids = updatedYesBids.map(b => {
                    if (Math.abs(b[0] - targetPrice) < 0.005) {
                      found = true;
                      return [b[0], Math.max(100, b[1] + qtyDelta)];
                    }
                    return b;
                  });
                  if (!found) {
                    updatedYesBids.push([targetPrice, Math.max(100, 1000 + qtyDelta)]);
                  }
                  updatedYesBids = updatedYesBids.filter(b => b[1] > 0).sort((a, b) => b[0] - a[0]);
                } else {
                  const targetPrice = parseFloat(Math.max(0.01, Math.min(0.99, (mkt.noBid || (1.0 - mkt.yesPrice) - 0.02) + priceDelta)).toFixed(2));
                  let found = false;
                  updatedNoBids = updatedNoBids.map(b => {
                    if (Math.abs(b[0] - targetPrice) < 0.005) {
                      found = true;
                      return [b[0], Math.max(100, b[1] + qtyDelta)];
                    }
                    return b;
                  });
                  if (!found) {
                    updatedNoBids.push([targetPrice, Math.max(100, 1000 + qtyDelta)]);
                  }
                  updatedNoBids = updatedNoBids.filter(b => b[1] > 0).sort((a, b) => b[0] - a[0]);
                }

                const newBook = PredictionEngine.reconstructOrderbook(updatedYesBids, updatedNoBids);

                // Sync top-of-book prices back to discoveredMarkets list
                setDiscoveredMarkets(prevMarkets => prevMarkets.map(item => {
                  if (item.id === mkt.id) {
                    const topYesAsk = newBook.yesAsks[0] ? newBook.yesAsks[0][0] : item.yesPrice;
                    const topNoAsk = newBook.noAsks[0] ? newBook.noAsks[0][0] : item.noPrice;
                    const topYesBid = newBook.yesBids[0] ? newBook.yesBids[0][0] : item.yesBid;
                    const topNoBid = newBook.noBids[0] ? newBook.noBids[0][0] : item.noBid;
                    
                    return {
                      ...item,
                      yesPrice: topYesAsk,
                      noPrice: topNoAsk,
                      yesBid: topYesBid,
                      noBid: topNoBid
                    };
                  }
                  return item;
                }));

                return {
                  ...prev,
                  [mkt.id]: newBook
                };
              });

              message = `[WS Orderbook Delta] Updated ${mkt.id} ${side} depth. Reconstructed asks via $1.00 constraint.`;
              break;
            }
            case 'MODEL': {
              if (scenarios.length === 0) return;
              const idx = Math.floor(Math.random() * scenarios.length);
              const target = scenarios[idx];
              const delta = parseFloat((Math.random() * 0.06 - 0.03).toFixed(3));
              const nextProb = Math.max(0.01, Math.min(0.90, target.probability + delta));

              setScenarios(prev => prev.map((sc, i) => i === idx ? { ...sc, probability: nextProb } : sc));
              message = `Model adjustment: Probability of '${target.name}' updated to ${(nextProb * 100).toFixed(1)}%.`;
              break;
            }
            case 'ENGINE': {
              message = `Recalculated portfolio scenario EV. EV is currently ${expectedValue >= 0 ? '+' : ''}$${expectedValue.toFixed(2)}.`;
              break;
            }
            case 'ARBITRAGE': {
              if (matrix.isArbitrageActive) {
                message = `🔥 ACTIVE ARBITRAGE DETECTED! Current portfolio yields a minimum risk-free profit of $${matrix.minPnL.toFixed(2)}.`;
              } else {
                message = `General arbitrage scanner active. Checking cross-platform hedging conditions...`;
              }
              break;
            }
          }

          setLogs(prev => [...prev.slice(-49), { id: Date.now(), type: randomType, time, message }]);
        }, simSpeed);

        return () => clearInterval(interval);
      }, [isSimulating, discoveredMarkets, scenarios, expectedValue, matrix, simSpeed]);

      // --- Trade Handling ---
      const handleCommitTrade = (e) => {
        e.preventDefault();
        const price = parseFloat(newTrade.price);
        const qty = parseInt(newTrade.quantity);

        if (isNaN(price) || price <= 0 || price >= 1) {
          alert('Price must be between 0.01 and 0.99');
          return;
        }
        if (isNaN(qty) || qty <= 0) {
          alert('Quantity must be greater than 0');
          return;
        }
        if (!newTrade.payoutScenarios || newTrade.payoutScenarios.length === 0) {
          alert('Select at least one settle scenario trigger.');
          return;
        }

        const position = {
          id: Date.now().toString(),
          platform: newTrade.platform,
          contractName: newTrade.contractName,
          outcome: newTrade.outcome,
          price,
          quantity: qty,
          orderType: newTrade.orderType,
          category: newTrade.platform === 'Polymarket' ? newTrade.category : 'Other',
          payoutScenarios: newTrade.payoutScenarios
        };

        setPortfolio(prev => [...prev, position]);
        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'ENGINE',
          time: new Date().toLocaleTimeString(),
          message: `Added trade: ${qty} ${newTrade.outcome} on '${newTrade.contractName}' (pays in ${newTrade.payoutScenarios.length} scenarios).`
        }]);
      };

      const handleAddLiveContract = (mkt, side) => {
        const suggested = suggestPayoutScenarios(mkt.title);
        const price = side === 'YES' ? mkt.yesPrice : mkt.noPrice;

        setNewTrade({
          platform: mkt.platform,
          contractName: mkt.title,
          outcome: side,
          price: price.toString(),
          quantity: '1000',
          orderType: mkt.orderType || 'Taker',
          category: mkt.category || 'Sports',
          payoutScenarios: suggested
        });

        // Scroll to form
        const formEl = document.getElementById('trade-form-section');
        if (formEl) {
          formEl.scrollIntoView({ behavior: 'smooth' });
        }

        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'ENGINE',
          time: new Date().toLocaleTimeString(),
          message: `Pre-loaded live contract '${mkt.title}' (${side}) with ${suggested.length} auto-suggested scenarios.`
        }]);
      };

      const handlePayoutScenarioToggle = (id) => {
        setNewTrade(prev => {
          const exists = prev.payoutScenarios.includes(id);
          const nextScenarios = exists
            ? prev.payoutScenarios.filter(sid => sid !== id)
            : [...prev.payoutScenarios, id];
          return { ...prev, payoutScenarios: nextScenarios };
        });
      };

      const handleRemoveTrade = (id) => {
        setPortfolio(prev => prev.filter(item => item.id !== id));
        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'ENGINE',
          time: new Date().toLocaleTimeString(),
          message: `Removed position from active portfolio.`
        }]);
      };

      const handleTemplateFrenchOpen = () => {
        setScenarios(defaultScenarios);
        setPortfolio([
          { id: 'p_1', platform: 'Polymarket', contractName: 'Andreeva Winner', outcome: 'YES', price: 0.62, quantity: 1500, orderType: 'Taker', category: 'Sports', payoutScenarios: ['sc_1', 'sc_2'] },
          { id: 'p_2', platform: 'Kalshi', contractName: 'Andreeva 2-1 Final Score', outcome: 'YES', price: 0.26, quantity: 1000, orderType: 'Taker', category: 'Other', payoutScenarios: ['sc_2'] },
          { id: 'p_3', platform: 'Kalshi', contractName: 'Chwalinska 2-0 Final Score', outcome: 'YES', price: 0.17, quantity: 500, orderType: 'Maker', category: 'Other', payoutScenarios: ['sc_3'] }
        ]);
        setLogs(prev => [...prev, {
          id: Date.now(),
          type: 'INFO',
          time: new Date().toLocaleTimeString(),
          message: 'French Open Women\'s Singles scenario template reset.'
        }]);
      };

      return (
        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 pt-8 pb-16">

          {/* Header Banner */}
          <header className="flex flex-col md:flex-row justify-between items-start md:items-center border-b border-zinc-800 pb-6 mb-8 gap-4">
            <div>
              <div className="flex items-center space-x-3">
                <span className="p-2 bg-indigo-650/20 text-indigo-400 rounded-lg border border-indigo-500/30">
                  <Icons.Activity />
                </span>
                <h1 className="text-3xl font-extrabold tracking-tight bg-gradient-to-r from-white via-zinc-200 to-indigo-400 bg-clip-text text-transparent">
                  Multi-Scenario prediction Market Risk Engine
                </h1>
              </div>
              <p className="text-sm text-zinc-400 mt-2">
                Evaluate cross-platform contract portfolios against a set of mutually exclusive event outcomes (e.g. French Open Final).
              </p>
            </div>

            <div className="flex flex-wrap gap-2">
              <button
                onClick={handleTemplateFrenchOpen}
                className="px-3.5 py-1.5 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 text-xs font-semibold rounded-lg border border-indigo-500/20 transition-all duration-200 flex items-center gap-1.5"
              >
                <Icons.Refresh /> Load French Open Template
              </button>
            </div>
          </header>

          {/* MAIN GRID */}
          <div className="grid grid-cols-1 md:grid-cols-12 gap-8">

            {/* Event Scenarios definition card */}
            <section className="cyber-card p-6 rounded-2xl md:col-span-5">
              <div className="flex justify-between items-center mb-4 border-b border-zinc-800 pb-2">
                <h2 className="text-md font-bold text-zinc-100 flex items-center gap-2">
                  <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                  Terminal Event Outcomes (Mutually Exclusive)
                </h2>
                <div className="flex gap-2">
                  <button
                    onClick={handleNormalizeProbabilities}
                    className="px-2 py-1 bg-zinc-800 hover:bg-zinc-700 text-zinc-300 font-mono text-[10px] rounded border border-zinc-700 transition"
                  >
                    Normalize %
                  </button>
                  <button
                    onClick={handleAddScenario}
                    className="px-2 py-1 bg-indigo-600/10 hover:bg-indigo-600/20 text-indigo-400 text-[10px] rounded border border-indigo-500/20 transition"
                  >
                    + Add Outcome
                  </button>
                </div>
              </div>

              <div className="space-y-3 max-h-[380px] overflow-y-auto pr-1">
                {scenarios.map((sc, index) => (
                  <div key={sc.id} className="flex items-center gap-3 bg-zinc-950/40 p-2.5 rounded-lg border border-zinc-900">
                    <span className="text-[10px] font-mono text-zinc-600 w-5">#{index + 1}</span>
                    <input
                      type="text"
                      value={sc.name}
                      onChange={(e) => handleScenarioNameChange(sc.id, e.target.value)}
                      placeholder="e.g. Swiatek wins 2-0"
                      className="flex-1 bg-transparent border-b border-transparent hover:border-zinc-800 focus:border-indigo-500 focus:outline-none text-xs text-zinc-200"
                    />

                    <div className="flex items-center gap-2">
                      <span className="text-[10px] font-mono text-zinc-500">PROB:</span>
                      <input
                        type="number"
                        step="0.05"
                        min="0"
                        max="1"
                        value={sc.probability}
                        onChange={(e) => handleScenarioProbChange(sc.id, e.target.value)}
                        className="w-14 bg-zinc-900 border border-zinc-800 rounded px-1.5 py-0.5 text-xs text-zinc-100 text-right font-mono focus:outline-none"
                      />
                      <span className="text-[11px] font-mono text-indigo-400 w-9 text-right">
                        {(sc.probability * 100).toFixed(1)}%
                      </span>
                    </div>

                    <button
                      onClick={() => handleRemoveScenario(sc.id)}

                        <th className="px-3 py-2.5">Contract Target</th>
                        <th className="px-3 py-2.5">Side</th>
                        <th className="px-3 py-2.5 text-right">Qty</th>
                        <th className="px-3 py-2.5 text-right">Price</th>
                        <th className="px-3 py-2.5 text-right">Cost</th>
                        <th className="px-3 py-2.5 text-right">MTM Val</th>
                        <th className="px-3 py-2.5 font-sans">Pays In Scenarios</th>
                        <th className="px-3 py-2.5 text-center">Action</th>
                      </tr>
                    </thead>
                    <tbody className="divide-y divide-zinc-800 font-mono text-zinc-300">
                      {matrix.positions.map((pos) => (
                        <tr key={pos.id} className="hover:bg-zinc-900/30 transition-all duration-150">
                          <td className="px-3 py-2.5 font-sans">
                            <span className={`px-1.5 py-0.5 rounded text-[8px] font-bold ${pos.platform === 'Polymarket' ? 'bg-indigo-600/20 text-indigo-400 border border-indigo-500/20' : 'bg-orange-600/20 text-orange-400 border border-orange-500/20'}`}>
                              {pos.platform}
                            </span>
                          </td>
                          <td className="px-3 py-2.5 font-sans font-medium text-zinc-200 max-w-[100px] truncate" title={pos.contractName}>
                            {pos.contractName}
                          </td>
                          <td className="px-3 py-2.5">
                            <span className={`px-1.5 py-0.5 rounded text-[8px] font-bold ${pos.outcome === 'YES' ? 'bg-emerald-500/10 text-emerald-400' : 'bg-rose-500/10 text-rose-400'}`}>
                              {pos.outcome}
                            </span>
                          </td>
                          <td className="px-3 py-2.5 text-right font-bold">{pos.quantity.toLocaleString()}</td>
                          <td className="px-3 py-2.5 text-right">${pos.price.toFixed(2)}</td>
                          <td className="px-3 py-2.5 text-right">${pos.totalCost.toFixed(2)}</td>
                          <td className="px-3 py-2.5 text-right font-bold text-zinc-200">
                            ${pos.liquidationValue.toFixed(2)}
                            {pos.isIlliquid && (
                              <span className="block text-[8px] text-amber-400 font-bold bg-amber-950/40 px-1 py-0.25 rounded mt-0.5 uppercase tracking-wide text-center">
                                Illiquid
                              </span>
                            )}
                          </td>
                          <td className="px-3 py-2.5 font-sans text-[10px] text-zinc-400 max-w-[120px] truncate" title={pos.payoutScenarios ? pos.payoutScenarios.map(sid => {
                            const found = scenarios.find(s => s.id === sid);
                            return found ? found.name : sid;
                          }).join(', ') : ''}>
                            {pos.payoutScenarios ? pos.payoutScenarios.map(sid => {
                              const found = scenarios.find(s => s.id === sid);
                              return found ? found.name.split(' ')[0] : sid;
                            }).join(', ') : 'None'}
                          </td>
                          <td className="px-3 py-2.5 text-center">
                            <button
                              onClick={() => handleRemoveTrade(pos.id)}
                              className="p-1 text-zinc-500 hover:text-rose-500 transition-colors"
                            >
                              <Icons.Trash />
                            </button>
                          </td>
                        </tr>
                      ))}
                    </tbody>
                  </table>
                </div>
              ) : (
                <div className="bg-zinc-950 border border-zinc-900 rounded-xl p-8 text-center text-zinc-500 text-sm font-sans">
                  No positions in current portfolio. Fetch live markets above or use the trade editor.
                </div>
              )}
            </section>

            {/* Financial Risk dashboard */}
            <section className="cyber-card p-6 rounded-2xl md:col-span-12">
              <h2 className="text-md font-bold text-zinc-100 flex items-center gap-2 mb-5 border-b border-zinc-800 pb-2">
                <span className="w-2.5 h-2.5 rounded-full bg-indigo-500"></span>
                Financial Outcome Matrix
              </h2>
              {/* STATS */}
              <div className="space-y-4 mb-6">
                {/* Row 1: Expiration Stats */}
                <div>
                  <span className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2 font-mono">Expiration / Settlement Forecast</span>
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Capital Invested</span>
                      <span className="text-xl font-extrabold text-zinc-200 font-mono">${matrix.totalCapitalDeployed.toFixed(2)}</span>
                      <span className="block text-[9px] text-zinc-500 mt-1">Cost + Fees</span>
                    </div>

                    <div className={`bg-zinc-950 border border-zinc-900 rounded-xl p-4 ${expectedValue >= 0 ? 'border-emerald-500/20' : 'border-rose-500/20'}`}>
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Expected Value (EV)</span>
                      <span className={`text-xl font-extrabold font-mono ${expectedValue >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {expectedValue >= 0 ? '+' : ''}${expectedValue.toFixed(2)}
                      </span>
                      <span className="block text-[9px] text-zinc-500 mt-1">Weighted by probability</span>
                    </div>

                    <div className="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Max Drawdown</span>
                      <span className="text-xl font-extrabold text-rose-500 font-mono">${matrix.maxDrawdownAmount.toFixed(2)}</span>
                      <span className="block text-[9px] text-zinc-500 mt-1">Worst-case outcome loss</span>
                    </div>

                    <div className={`bg-zinc-950 border border-zinc-900 rounded-xl p-4 ${matrix.isArbitrageActive ? 'border-emerald-500 glow-success' : 'border-zinc-900'}`}>
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Arbitrage Status</span>
                      <span className={`text-sm font-extrabold uppercase font-sans ${matrix.isArbitrageActive ? 'text-emerald-400' : 'text-zinc-500'}`}>
                        {matrix.isArbitrageActive ? '🔥 ARB ENABLED' : 'Inactive'}
                      </span>
                      <span className="block text-[9px] text-zinc-500 mt-1">
                        {matrix.isArbitrageActive ? `Min Profit: +$${matrix.minPnL.toFixed(2)}` : 'Risk not fully covered'}
                      </span>
                    </div>
                  </div>
                </div>

                {/* Row 2: Mark-to-Market Liquidation Stats */}
                <div>
                  <span className="block text-[10px] font-bold text-zinc-400 uppercase tracking-wider mb-2 font-mono">Real-Time Mark-to-Market (VWAP Walkdown)</span>
                  <div className="grid grid-cols-2 lg:grid-cols-4 gap-4">
                    <div className="bg-zinc-950 border border-zinc-900 rounded-xl p-4">
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">MTM Liquidation Value</span>
                      <span className="text-xl font-extrabold text-zinc-200 font-mono">${totalLiquidationValue.toFixed(2)}</span>
                      <span className="block text-[9px] text-zinc-500 mt-1">Proceeds if executed now</span>
                    </div>

                    <div className={`bg-zinc-950 border border-zinc-900 rounded-xl p-4 ${mtmPnL >= 0 ? 'border-emerald-500/20' : 'border-rose-500/20'}`}>
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">MTM Net P&L</span>
                      <span className={`text-xl font-extrabold font-mono ${mtmPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {mtmPnL >= 0 ? '+' : ''}${mtmPnL.toFixed(2)}
                      </span>
                      <span className="block text-[9px] text-zinc-500 mt-1">Current liquidation gain</span>
                    </div>

                    <div className={`bg-zinc-950 border border-zinc-900 rounded-xl p-4 ${mtmPnL >= 0 ? 'border-emerald-500/20' : 'border-rose-500/20'}`}>
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">MTM ROI</span>
                      <span className={`text-xl font-extrabold font-mono ${mtmPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                        {actualMtmRoi.toFixed(2)}%
                      </span>
                      <span className="block text-[9px] text-zinc-500 mt-1">Return on capital</span>
                    </div>

                    <div className={`bg-zinc-950 border border-zinc-900 rounded-xl p-4 ${evaluatedPositions.some(p => p.isIlliquid) ? 'border-amber-500/50' : 'border-zinc-900'}`}>
                      <span className="block text-[10px] font-bold text-zinc-500 uppercase tracking-wide mb-1">Book Liquidity Status</span>
                      <span className={`text-sm font-extrabold uppercase font-sans ${evaluatedPositions.some(p => p.isIlliquid) ? 'text-amber-500 animate-pulse' : 'text-emerald-400'}`}>
                        {evaluatedPositions.some(p => p.isIlliquid) ? '⚠️ ILLIQUID LIMITS' : '✓ LIQUID'}
                      </span>
                      <span className="block text-[9px] text-zinc-500 mt-1 font-sans">
                        {evaluatedPositions.some(p => p.isIlliquid) ? 'Order sizes exceed bid depth' : 'Depth satisfies holdings'}
                      </span>
                    </div>
                  </div>
                </div>
              </div>

              {/* Scenario Bar Chart */}
              <div className="bg-zinc-950 border border-zinc-900 rounded-xl p-4 mb-6 h-60 relative">
                <canvas ref={chartRef}></canvas>
              </div>

              {/* Multi-Scenario payoff matrix table */}
              <div className="border border-zinc-800 rounded-xl overflow-hidden">
                <table className="w-full text-sm text-left">
                  <thead className="bg-zinc-900/60 text-xs font-bold text-zinc-400 uppercase tracking-wider border-b border-zinc-800">
                    <tr>
                      <th className="px-4 py-3">Outcome Scenario</th>
                      <th className="px-4 py-3 text-right">Probability</th>
                      <th className="px-4 py-3 text-right">Gross Payoff</th>
                      <th className="px-4 py-3 text-right">Net Profit</th>
                      <th className="px-4 py-3 text-right">Scenario ROI</th>
                    </tr>
                  </thead>
                  <tbody className="divide-y divide-zinc-800 font-mono text-xs">
                    {matrix.scenarios.map((sc) => (
                      <tr key={sc.scenarioId} className="hover:bg-zinc-900/20 transition-all duration-150">
                        <td className="px-4 py-3 text-zinc-300 font-semibold font-sans">{sc.scenarioName}</td>
                        <td className="px-4 py-3 text-right text-zinc-400">{(sc.probability * 100).toFixed(1)}%</td>
                        <td className="px-4 py-3 text-right text-zinc-200">${sc.payout.toFixed(2)}</td>
                        <td className={`px-4 py-3 text-right font-bold ${sc.netPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {sc.netPnL >= 0 ? '+' : ''}${sc.netPnL.toFixed(2)}
                        </td>
                        <td className={`px-4 py-3 text-right font-bold ${sc.netPnL >= 0 ? 'text-emerald-400' : 'text-rose-400'}`}>
                          {sc.roi.toFixed(2)}%
                        </td>
                      </tr>
                    ))}
                  </tbody>
                </table>
              </div>
            </section>

          </div>
        </div>
      );
    }

    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>

</html>
